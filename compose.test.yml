# Local test only (not used by Railway): app + Postgres + SeaweedFS S3 standing in for a Railway Bucket.
services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: localtest, POSTGRES_DB: railway}
    volumes: [pg:/var/lib/postgresql/data]
  s3:
    image: chrislusf/seaweedfs:3.99
    command: server -s3 -s3.config=/etc/s3.json -dir=/data
    configs: [{source: s3cfg, target: /etc/s3.json}]
  app:
    build: .
    mem_limit: 512m
    cpus: 1
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgres://postgres:localtest@postgres:5432/railway
      DJANGO_HELPDESK_SECRET_KEY: local-test-secret-key-0123456789abcdef
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: local-test-password-123
      DJANGO_SECURE_COOKIES: "false"
      AWS_STORAGE_BUCKET_NAME: ${BUCKET:-}
      AWS_S3_ENDPOINT_URL: http://s3:8333
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      AWS_ACCESS_KEY_ID: localkey
      AWS_SECRET_ACCESS_KEY: localsecret123
    depends_on: [postgres]
volumes: {pg: {}}
configs:
  s3cfg:
    content: |
      {"identities":[{"name":"t","credentials":[{"accessKey":"localkey","secretKey":"localsecret123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
