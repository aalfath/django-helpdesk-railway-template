# Local test only (not used by Railway): app + Postgres + MinIO standing in for a Railway Bucket.
services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: localtest, POSTGRES_DB: railway}
    volumes: [pg:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment: {MINIO_ROOT_USER: localminio, MINIO_ROOT_PASSWORD: localminio123}
  app:
    build: .
    mem_limit: 512m
    cpus: 1
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgres://postgres:localtest@postgres:5432/railway
      DJANGO_HELPDESK_SECRET_KEY: local-test-secret-key-0123456789abcdef
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: local-test-password-123
      DJANGO_SECURE_COOKIES: "false"
      AWS_STORAGE_BUCKET_NAME: ${BUCKET:-}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      AWS_ACCESS_KEY_ID: localminio
      AWS_SECRET_ACCESS_KEY: localminio123
    depends_on: [postgres]
volumes: {pg: {}}
